<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Interface - PRO MAX</title>

    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/easeljs@1.0.2/lib/easeljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ros2d@0.10.0/build/ros2d.min.js"></script>

    <style>
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top left, #2c2c30, #121212 80%); color: #e5e9e5; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header & Connection Indicator */
        .header-status { text-align: center; margin-bottom: 20px; padding: 15px; background: rgba(30, 30, 30, 0.9); border-radius: 10px; border: 1px solid #444; display: flex; justify-content: center; align-items: center; gap: 20px; transition: all 0.3s ease;}
        .connection-indicator { font-weight: bold; padding: 6px 16px; border-radius: 20px; font-size: 0.9em; display: flex; align-items: center; gap: 8px; letter-spacing: 1px; transition: all 0.3s ease;}
        .status-led { width: 10px; height: 10px; border-radius: 50%; display: inline-block; transition: all 0.3s ease; }
        
        .connected { color: #4CAF50; background: rgba(76, 175, 80, 0.1); border: 1px solid rgba(76, 175, 80, 0.3); }
        .connected .status-led { background: #4CAF50; box-shadow: 0 0 10px #4CAF50; }
        
        .disconnected { color: #f44336; background: rgba(244, 67, 54, 0.1); border: 1px solid rgba(244, 67, 54, 0.3); }
        .disconnected .status-led { background: #f44336; box-shadow: 0 0 10px #f44336; }
        
        /* Layout */
        .grid { display: grid; grid-template-columns: 1fr 400px; gap: 20px; }
        .section { background: rgba(40, 42, 40, 0.8); padding: 25px; border-radius: 15px; border: 1px solid rgba(20, 156, 76, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .section:hover { box-shadow: 0 12px 35px rgba(0,0,0,0.6); border-color: rgba(20, 156, 76, 0.4); }
        h2 { color: #149c4c; margin-top: 0; border-bottom: 2px solid rgba(20, 156, 76, 0.2); padding-bottom: 10px; text-transform: uppercase; font-size: 1.2em; letter-spacing: 1px; }

        /* Map Container */
        #map-container { width: 100%; height: 400px; margin: 0 auto; background: #111; border-radius: 10px; border: 1px solid #333; overflow: hidden; cursor: crosshair; position: relative; transition: all 0.3s ease; }
        
        /* Status Grid */
        .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .status-item { background: #0b0b0b; padding: 12px; border-radius: 8px; border-left: 3px solid #149c4c; transition: background 0.3s ease; }
        .status-item:hover { background: #1a1a1a; }
        .status-label { color: #888; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-value { color: #149c4c; font-size: 1.1em; font-weight: bold; font-family: 'Consolas', monospace; margin-top: 4px; }

        /* Buttons & Controls */
        .mode-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button { background: #2a2a2a; color: #e5e9e5; border: 1px solid #555; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s ease; text-transform: uppercase; font-size: 0.85em; letter-spacing: 0.5px; }
        button:hover:not(:disabled) { background: #3a3a3a; border-color: #149c4c; transform: translateY(-1px); }
        button:active:not(:disabled) { transform: translateY(1px); }
        button.active { background: #149c4c; color: #fff; border-color: #21d368; box-shadow: 0 0 15px rgba(20, 156, 76, 0.3); }
        
        /* Interlock Disabled State */
        button:disabled { opacity: 0.4; cursor: not-allowed; border-color: #222; background: #1a1a1a; color: #555; box-shadow: none; transform: none; }
        
        /* Teleop Controls */
        .drive-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 200px; margin: 20px auto; }
        .drive-controls button { aspect-ratio: 1; font-size: 1.2em; padding: 0; display: flex; justify-content: center; align-items: center; }
        .stop-btn { background: #8b0000 !important; border-color: #ff4444 !important; color: white; }
        .stop-btn:hover:not(:disabled) { background: #cc0000 !important; box-shadow: 0 0 12px rgba(255, 68, 68, 0.4); }
        
        input[type="number"] { background: #0b0b0b; color: #149c4c; border: 1px solid #444; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; box-sizing: border-box; transition: border-color 0.3s ease; }
        input[type="number"]:focus { outline: none; border-color: #149c4c; }

        /* Custom Speed Slider Styles */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #149c4c; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px rgba(20, 156, 76, 0.5); transition: transform 0.1s; }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #333; border-radius: 4px; border: 1px solid #444; }
        
        /* SLAM Panel */
        .slam-box { margin-top: 20px; padding: 15px; background: rgba(255, 165, 0, 0.05); border: 1px solid rgba(255, 165, 0, 0.3); border-radius: 10px; text-align: center; }
        .btn-start-slam { background: #cc8400; color: #fff; border-color: orange; width: 100%; margin-top: 10px; }
        .btn-start-slam:hover:not(:disabled) { background: #e69500; border-color: #ffb732; box-shadow: 0 0 15px rgba(255, 165, 0, 0.3); }
        .btn-stop-slam { background: #149c4c; color: white; border-color: #21d368; width: 100%; margin-top: 10px; }
        
        /* Animations */
        @keyframes fadeInSlide { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .anim-panel { animation: fadeInSlide 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .hidden { display: none !important; }
        
        /* RViz Legend */
        .map-legend { position: absolute; bottom: 12px; left: 12px; background: rgba(15, 15, 15, 0.85); padding: 10px 12px; border-radius: 6px; font-size: 0.75em; border: 1px solid #333; pointer-events: none; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .legend-item:last-child { margin-bottom: 0; }
        .color-box { width: 12px; height: 12px; border-radius: 3px; }

        /* --- Splash Screen Styles --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111; /* Solid dark background */
            z-index: 9999; /* Ensure it covers everything */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }

        .splash-content {
            text-align: center;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .splash-title {
            font-size: 3.5em;
            font-weight: bold;
            color: #fff;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .splash-subtitle {
            color: #888;
            font-size: 0.9em;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        /* Loading Bar Animation */
        .loading-bar {
            width: 250px;
            height: 4px;
            background: #333;
            margin: 0 auto;
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: #149c4c;
            animation: loadProgress 1.5s ease-in-out forwards;
        }

        /* Splash Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* Class added by JS to trigger the fade */
        .fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="splash-content">
        <div class="splash-title">AMR<span style="color: #149c4c;">PRO MAX</span></div>
        <div class="splash-subtitle">INITIALIZING SYSTEM...</div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>
</div>

<div class="container">
    <div class="header-status">
        <div id="connIndicator" class="connection-indicator disconnected">
            <span class="status-led"></span>
            <span id="connText">DISCONNECTED</span>
        </div>
        <div style="color: #888; font-size: 0.9em; letter-spacing: 1px;">SYSTEM MODE: <span id="currentMode" style="color:#149c4c; font-weight:bold; margin-left: 5px;">IDLE</span></div>
    </div>

    <div class="grid">
        <div class="section">
            <h2>Environment Map</h2>
            <div id="map-container">
                <div class="map-legend">
                    <div class="legend-item"><div class="color-box" style="background: #ff3333;"></div> Robot Position</div>
                    <div class="legend-item"><div class="color-box" style="background: #00ff00;"></div> Laser Scan</div>
                </div>
            </div>
            <div class="status-grid">
                <div class="status-item"><div class="status-label">X Axis (m)</div><div class="status-value" id="posX">0.00</div></div>
                <div class="status-item"><div class="status-label">Y Axis (m)</div><div class="status-value" id="posY">0.00</div></div>
                <div class="status-item"><div class="status-label">Heading</div><div class="status-value" id="posYaw">0.0°</div></div>
                <div class="status-item"><div class="status-label">Nav2 State</div><div class="status-value" id="goalStatus">IDLE</div></div>
            </div>
        </div>

        <div class="section">
            <h2>Control Panel</h2>
            <div class="mode-buttons">
                <button class="mode-btn active" id="btn-idle" onclick="setMode('IDLE')">Idle</button>
                <button class="mode-btn" id="btn-manual" onclick="setMode('MANUAL')">Manual</button>
                <button class="mode-btn" id="btn-navigate" onclick="setMode('NAVIGATION')">Navigate</button>
                <button class="mode-btn" id="btn-following" onclick="setMode('FOLLOWING')">Follow Me</button>
            </div>

            <div id="manualSection" class="hidden">
                <div class="anim-panel" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; text-align: center;">
                    <label for="speedSlider" style="color: #888; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px;">
                        Max Teleop Speed: <span id="speedValue" style="color: #149c4c; font-weight: bold; font-family: monospace; font-size: 1.2em;">0.5</span> m/s
                    </label>
                    <input type="range" id="speedSlider" min="0.1" max="1.5" step="0.1" value="0.5" 
                           oninput="document.getElementById('speedValue').innerText = parseFloat(this.value).toFixed(1)">
                </div>

                <div class="anim-panel" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; text-align: center;">
                    <label for="speedSlider" style="color: #888; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px;">
                        Max Teleop Speed: <span id="speedValue" style="color: #149c4c; font-weight: bold; font-family: monospace; font-size: 1.2em;">0.5</span> m/s
                    </label>
                    <input type="range" id="speedSlider" min="0.1" max="1.5" step="0.1" value="0.5" 
                        oninput="document.getElementById('speedValue').innerText = parseFloat(this.value).toFixed(1)">
                    </div>

                <div class="drive-controls anim-panel">
                    <div></div><button onmousedown="startDrive(1, 0)" onmouseup="stopDrive()" onmouseleave="stopDrive()">W</button><div></div>
                    <button onmousedown="startDrive(0, 1.0)" onmouseup="stopDrive()" onmouseleave="stopDrive()">A</button>
                    <button class="stop-btn" onclick="stopDrive()">STOP</button>
                    <button onmousedown="startDrive(0, -1.0)" onmouseup="stopDrive()" onmouseleave="stopDrive()">D</button>
                    <div></div><button onmousedown="startDrive(-1, 0)" onmouseup="stopDrive()" onmouseleave="stopDrive()">S</button><div></div>
                </div>
                
                <div class="slam-box anim-panel">
                    <p id="slamText" style="color:#e69500; margin: 0 0 12px 0; font-weight: bold; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px;">Mapping Control</p>
                    <button id="btnStartSlam" class="btn-start-slam" onclick="setMode('MAPPING')">Start Mapping</button>
                    <button id="btnStopSlam" class="btn-stop-slam hidden" onclick="setMode('IDLE')">Finish & Save</button>
                </div>
            </div>

            <div id="navSection" class="hidden">
                <div class="anim-panel" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333;">
                    <p style="font-size: 0.75em; color: #888; margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 0.5px;">Click map to set goal or enter coordinates</p>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <input type="number" id="goalX" placeholder="Target X" step="0.1">
                        <input type="number" id="goalY" placeholder="Target Y" step="0.1">
                    </div>
                </div>
                <div class="anim-panel" style="display: grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button onclick="sendGoal()" style="background:#149c4c; border-color:#21d368;">Dispatch</button>
                    <button onclick="cancelGoal()" style="background:#555; border-color:#777;">Abort</button>
                </div>
            </div>

            <div id="followSection" class="hidden">
                <div class="anim-panel" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333;">
                    <p style="font-size: 0.75em; color: #888; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px;">Select Tracking Target</p>
                    
                    <select id="targetSelect" style="background: #0b0b0b; color: #149c4c; border: 1px solid #444; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; box-sizing: border-box; margin-bottom: 15px; cursor: pointer; outline: none;">
                        <option value="human">Human (Person)</option>
                        <option value="ball">Sports Ball</option>
                    </select>

                    <div id="video-container" style="width: 100%; aspect-ratio: 4/3; background: #000; border: 1px solid #444; border-radius: 6px; position: relative; overflow: hidden; display: flex; flex-direction: column;">
                        <div style="flex: 1; background: #000; position: relative;">
                            <span style="color: #0000ff; font-family: monospace; font-size: 1.2em; font-weight: bold; position: absolute; top: 15px; left: 15px;">Waiting for command...</span>
                        </div>
                        <div style="flex: 1; background: linear-gradient(to bottom, #cccccc, #eeeeee);"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Config ROS
    const ros = new ROSLIB.Ros({ url: 'ws://' + window.location.hostname + ':9090' });
    
    // Publishers
    const cmdVelPub = new ROSLIB.Topic({ ros: ros, name: '/cmd_vel_teleop', messageType: 'geometry_msgs/msg/Twist' });    
    const uiModePub = new ROSLIB.Topic({ ros: ros, name: '/ui/mode/absolute', messageType: 'std_msgs/msg/String' });
    const uiGoalPub = new ROSLIB.Topic({ ros: ros, name: '/ui/nav_goal', messageType: 'geometry_msgs/msg/PoseStamped' });

    let viewer, mapClient, robotMarker;
    
    // Variabile pentru Interactivitatea Hartii
    let isTrackingRobot = true;
    let interactionTimer = null;
    const DEFAULT_ZOOM = 45; // Pixeli per metru

    ros.on('connection', () => {
        document.getElementById('connIndicator').className = 'connection-indicator connected';
        document.getElementById('connText').textContent = 'CONNECTED';
        initMap();
    });

    ros.on('close', () => {
        document.getElementById('connIndicator').className = 'connection-indicator disconnected';
        document.getElementById('connText').textContent = 'DISCONNECTED';
    });

    // --- Splash Screen Logic ---
    window.addEventListener('load', () => {
        // Wait 1.8 seconds (giving the 1.5s CSS bar time to finish) before fading out
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.classList.add('fade-out');
                // Remove from DOM entirely after the fade transition (0.8s) completes
                setTimeout(() => splash.remove(), 800);
            }
        }, 1800);
    });

    function triggerMapInteraction() {
        isTrackingRobot = false;
        clearTimeout(interactionTimer);
        
        interactionTimer = setTimeout(() => {
            isTrackingRobot = true;
            viewer.scene.scaleX = DEFAULT_ZOOM;
            viewer.scene.scaleY = DEFAULT_ZOOM;
        }, 5000);
    }

    function initMap() {
        if(viewer) return;

        const mapContainer = document.getElementById('map-container');
        viewer = new ROS2D.Viewer({
            divID: 'map-container',
            width: mapContainer.clientWidth,
            height: 400,
            background: '#111'
        });

        mapClient = new ROS2D.OccupancyGridClient({
            ros: ros,
            rootObject: viewer.scene,
            continuous: true,
            topic: '/map'
        });

        mapClient.on('change', () => {
            if (!viewer.scene.__initialized) {
                viewer.scene.scaleX = DEFAULT_ZOOM;
                viewer.scene.scaleY = DEFAULT_ZOOM;
                viewer.scene.__initialized = true;
            }

            if (document.getElementById('currentMode').innerText === 'MAPPING' && isTrackingRobot) {
                const viewWidth = document.getElementById('map-container').clientWidth;
                const viewHeight = 400;
                const mapOffsetX = mapClient.currentGrid.pose.position.x;
                const mapOffsetY = mapClient.currentGrid.pose.position.y;
                
                viewer.scene.x = (viewWidth / 2) - ((lastRobotPose.x - mapOffsetX) * viewer.scene.scaleX);
                viewer.scene.y = (viewHeight / 2) - (-(lastRobotPose.y - mapOffsetY) * viewer.scene.scaleY);
            }
        });

        robotMarker = new createjs.Shape();
        robotMarker.graphics.beginFill('#333333').drawRoundRect(-0.15, 0.18, 0.3, 0.1, 0.02); 
        robotMarker.graphics.beginFill('#333333').drawRoundRect(-0.15, -0.28, 0.3, 0.1, 0.02); 
        robotMarker.graphics.setStrokeStyle(0.03).beginStroke('#ffffff').beginFill('#ff3333').drawCircle(0, 0, 0.22); 
        robotMarker.graphics.beginFill('#ffffff').moveTo(0.05, -0.15).lineTo(0.35, 0).lineTo(0.05, 0.15).closePath(); 
        viewer.scene.addChild(robotMarker);

        const odomSub = new ROSLIB.Topic({ ros: ros, name: '/odom_nav2', messageType: 'nav_msgs/msg/Odometry' });
        let lastRobotPose = { x: 0, y: 0, yaw: 0 };

        odomSub.subscribe((msg) => {
            const p = msg.pose.pose.position;
            const q = msg.pose.pose.orientation;
            
            lastRobotPose.x = p.x;
            lastRobotPose.y = p.y;
            lastRobotPose.yaw = Math.atan2(2.0*(q.w*q.z + q.x*q.y), 1.0-2.0*(q.y*q.y + q.z*q.z));
            
            document.getElementById('posX').innerText = p.x.toFixed(2);
            document.getElementById('posY').innerText = p.y.toFixed(2);
            document.getElementById('posYaw').innerText = (lastRobotPose.yaw * 180 / Math.PI).toFixed(1) + '°';

            robotMarker.x = p.x;
            robotMarker.y = -p.y; 
            robotMarker.rotation = -lastRobotPose.yaw * (180 / Math.PI);

            if (isTrackingRobot) {
                const currentMode = document.getElementById('currentMode').innerText;
                const viewWidth = document.getElementById('map-container').clientWidth;
                const viewHeight = 400;

                if (currentMode === 'MAPPING') {
                    if(mapClient.currentGrid && mapClient.currentGrid.pose) {
                         const mapOffsetX = mapClient.currentGrid.pose.position.x;
                         const mapOffsetY = mapClient.currentGrid.pose.position.y;
                         
                         viewer.scene.x = (viewWidth / 2) - ((p.x - mapOffsetX) * viewer.scene.scaleX);
                         viewer.scene.y = (viewHeight / 2) - (-(p.y - mapOffsetY) * viewer.scene.scaleY);
                    }
                } else {
                    viewer.scene.x = (viewWidth / 2) - (p.x * viewer.scene.scaleX);
                    viewer.scene.y = (viewHeight / 2) - (-p.y * viewer.scene.scaleY);
                }
            }
        });

        let isDragging = false;
        let lastPanX = 0, lastPanY = 0;
        let mouseDownX = 0, mouseDownY = 0;

        viewer.scene.addEventListener('stagemousedown', (event) => {
            isDragging = true;
            lastPanX = event.stageX;
            lastPanY = event.stageY;
            mouseDownX = event.stageX;
            mouseDownY = event.stageY;
            triggerMapInteraction();
        });

        viewer.scene.addEventListener('stagemousemove', (event) => {
            if (isDragging) {
                const dx = event.stageX - lastPanX;
                const dy = event.stageY - lastPanY;
                viewer.scene.x += dx;
                viewer.scene.y += dy;
                lastPanX = event.stageX;
                lastPanY = event.stageY;
                triggerMapInteraction(); 
            }
        });

        viewer.scene.addEventListener('stagemouseup', (event) => {
            isDragging = false;
            const moveDist = Math.hypot(event.stageX - mouseDownX, event.stageY - mouseDownY);

            if (moveDist < 5) {
                if (document.getElementById('currentMode').innerText === 'NAVIGATION') {
                    const pos = viewer.scene.globalToRos(event.stageX, event.stageY);
                    executeGoal(pos.x, pos.y, 0);
                }
            }
        });

        mapContainer.addEventListener('wheel', (event) => {
            event.preventDefault();
            triggerMapInteraction(); 

            const zoomFactor = event.deltaY > 0 ? 0.85 : 1.15;
            const oldScale = viewer.scene.scaleX;
            const newScale = oldScale * zoomFactor;

            if (newScale < 10 || newScale > 200) return;

            const rect = mapContainer.getBoundingClientRect();
            const stageX = event.clientX - rect.left;
            const stageY = event.clientY - rect.top;

            viewer.scene.x = stageX - (stageX - viewer.scene.x) * (newScale / oldScale);
            viewer.scene.y = stageY - (stageY - viewer.scene.y) * (newScale / oldScale);
            
            viewer.scene.scaleX = newScale;
            viewer.scene.scaleY = newScale;
        });
    }

    function updateInterlocks(mode) {
        const btns = {
            idle: document.getElementById('btn-idle'),
            manual: document.getElementById('btn-manual'),
            navigate: document.getElementById('btn-navigate'),
            following: document.getElementById('btn-following')
        };
        Object.values(btns).forEach(b => { if(b) b.disabled = false; });
        if (mode === 'MAPPING') {
            if(btns.navigate) btns.navigate.disabled = true;
            if(btns.following) btns.following.disabled = true;
        } else if (mode === 'NAVIGATION') {
            if(btns.manual) btns.manual.disabled = true;
            if(btns.following) btns.following.disabled = true;
        } else if (mode === 'FOLLOWING') {
            if(btns.manual) btns.manual.disabled = true;
            if(btns.navigate) btns.navigate.disabled = true;
        }
    }

    function setMode(mode) {
        const isManualOrMapping = (mode === 'MANUAL' || mode === 'MAPPING');
        const isNavigating = (mode === 'NAVIGATION');
        const isMapping = (mode === 'MAPPING');
        const isFollowing = (mode === 'FOLLOWING');

        document.getElementById('manualSection').classList.toggle('hidden', !isManualOrMapping);
        document.getElementById('navSection').classList.toggle('hidden', !isNavigating);
        document.getElementById('followSection').classList.toggle('hidden', !isFollowing);
        
        document.getElementById('btnStartSlam').classList.toggle('hidden', isMapping);
        document.getElementById('btnStopSlam').classList.toggle('hidden', !isMapping);
        
        const modeMsg = new ROSLIB.Message({ data: mode });
        uiModePub.publish(modeMsg);
    }
    
    let driveInterval = null;

    function startDrive(base_lin, base_ang) {
        if (driveInterval) return;
        
        // Define the publisher loop
        const publishSpeed = () => {
            // Get the live value from the slider ID "speedSlider"
            const speedScale = parseFloat(document.getElementById('speedSlider').value);
            
            // Calculate scaled velocities
            const scaledLin = base_lin * speedScale;
            const scaledAng = base_ang * speedScale;
            
            const msg = new ROSLIB.Message({ 
                linear: {x: scaledLin, y:0, z:0}, 
                angular: {x:0, y:0, z:scaledAng} 
            });
            
            cmdVelPub.publish(msg);
        };

        // Execute immediately on press
        publishSpeed();
        
        // Loop at 10Hz to keep the stream alive
        driveInterval = setInterval(publishSpeed, 100);
    }

    function stopDrive() {
        clearInterval(driveInterval);
        driveInterval = null;
        // Send a zero-velocity command to ensure the robot stops when button is released
        cmdVelPub.publish({ 
            linear: {x:0, y:0, z:0}, 
            angular: {x:0, y:0, z:0} 
        });
    }

    function sendGoal() {
        const x = parseFloat(document.getElementById('goalX').value || 0);
        const y = parseFloat(document.getElementById('goalY').value || 0);
        executeGoal(x, y, 0);
    }

    function executeGoal(x, y, yaw) {
        const goal = new ROSLIB.Message({
            header: { frame_id: 'map', stamp: { sec: 0, nanosec: 0 } },
            pose: {
                position: { x: x, y: y, z: 0.0 },
                orientation: { x: 0.0, y: 0.0, z: Math.sin(yaw/2), w: Math.cos(yaw/2) }
            }
        });
        uiGoalPub.publish(goal);
        document.getElementById('goalStatus').innerText = 'ACTIVE';
        setMode('NAVIGATION');
    }

    function cancelGoal() {
        setMode('IDLE');
        document.getElementById('goalStatus').innerText = 'IDLE';
    }
</script>
</body>
