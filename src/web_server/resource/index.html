<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Control Interface</title>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<style>
/* --- ORIGINAL DARK/GREEN UI STYLE --- */
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #2e2e32;
  background: radial-gradient(circle at top left, #3a3a3f, #232324 70%);
  color: #e5e9e5;
}
.container { max-width: 1200px; margin: 0 auto; }

/* Status Header */
.header-status {
  text-align: center;
  margin: 20px 0;
  padding: 15px;
  background: #2a2a2a;
  border-radius: 5px;
  border: 1px solid #333;
}
.connection-indicator { font-weight: bold; padding: 5px 10px; border-radius: 4px; }
.connected { color: #4CAF50; background: rgba(76, 175, 80, 0.1); }
.disconnected { color: #f44336; background: rgba(244, 67, 54, 0.1); }

/* Layout */
.grid {
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 20px;
  margin-bottom: 20px;
}
@media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }

.section {
  background: rgba(50, 52, 50, 0.75);
  padding: 25px;
  border-radius: 15px;
  border: 1px solid rgba(20, 156, 76, 0.25);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(8px);
}

h2 {
  color: #149c4c;
  margin-bottom: 20px;
  font-size: 1.5em;
  border-bottom: 2px solid rgba(20, 156, 76, 0.35);
  padding-bottom: 10px;
}

/* Visualization */
#robotCanvas {
  width: 100%;
  height: 500px;
  background: #fff;
  border: 2px solid rgba(20, 156, 76, 0.35);
  border-radius: 10px;
}

/* Stats */
.status-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-top: 20px;
}
.status-item {
  background: rgba(0, 0, 0, 0.35);
  padding: 12px;
  border-radius: 8px;
  border-left: 4px solid #149c4c;
}
.status-label { color: #888; font-size: 0.8em; text-transform: uppercase; margin-bottom: 5px; }
.status-value { color: #149c4c; font-size: 1.2em; font-weight: bold; font-family: 'Courier New', monospace; }

/* Buttons */
.mode-buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
button {
  background: linear-gradient(145deg, #414741, #2e332e);
  color: #e0e0e0;
  border: 2px solid rgba(20, 156, 76, 0.35);
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1em;
  font-weight: 600;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
}
button:hover {
  background: linear-gradient(145deg, #4d554d, #383e38);
  border-color: #149c4c;
  box-shadow: 0 0 15px rgba(20, 156, 76, 0.4);
  transform: translateY(-2px);
}
button:active { transform: translateY(0); }

/* Active State */
button.active {
  background: linear-gradient(145deg, #149c4c, #0d6f35);
  color: #fff;
  border-color: #21d368;
  box-shadow: 0 0 25px rgba(20, 156, 76, 0.55);
}

/* Manual Drive Controls */
.drive-controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 250px;
  margin: 20px auto;
}
.drive-controls button {
  padding: 15px;
  font-size: 1.5em;
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
}
.stop-btn {
  background: linear-gradient(145deg, #ff4444, #cc0000) !important;
  border-color: #ff6666 !important;
}
.stop-btn:hover {
  background: linear-gradient(145deg, #ff6666, #dd2222) !important;
  box-shadow: 0 0 15px rgba(255, 68, 68, 0.6) !important;
}

/* Helper to hide sections */
.hidden { display: none; }

/* Nav Inputs */
.nav-inputs { display: grid; gap: 15px; margin-bottom: 20px; }
.input-group { display: flex; flex-direction: column; }
.input-group label { color: #149c4c; font-weight: 600; margin-bottom: 8px; font-size: 0.9em; text-transform: uppercase; }
input[type=number] {
  background: rgba(40, 42, 40, 0.85);
  color: #149c4c;
  border: 2px solid rgba(20, 156, 76, 0.35);
  padding: 10px;
  border-radius: 8px;
  font-size: 1.1em;
  font-weight: bold;
}
input:focus { outline: none; border-color: #149c4c; box-shadow: 0 0 15px rgba(20, 156, 76, 0.35); }
.nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>

<div class="container">
  
  <div class="header-status">
    <span class="connection-indicator disconnected" id="connIndicator">● DISCONNECTED</span>
    <span style="color: #666; margin: 0 20px;">|</span>
    <span style="color: #888;">Current Mode:</span>
    <span style="color: #149c4c; font-weight: bold; margin-left: 10px;" id="currentMode">UNKNOWN</span>
  </div>

  <div class="grid">
    <div class="section">
      <h2>📊 Visualization</h2>
      <canvas id="robotCanvas" width="800" height="600"></canvas>
      
      <div class="status-grid">
        <div class="status-item">
          <div class="status-label">Position X</div>
          <div class="status-value" id="posX">0.00</div>
        </div>
        <div class="status-item">
          <div class="status-label">Position Y</div>
          <div class="status-value" id="posY">0.00</div>
        </div>
        <div class="status-item">
          <div class="status-label">Orientation</div>
          <div class="status-value" id="posYaw">0.00°</div>
        </div>
        <div class="status-item">
          <div class="status-label">Goal Status</div>
          <div class="status-value" id="goalStatus">IDLE</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>🎮 Mode Selection</h2>
      <div class="mode-buttons">
        <button class="mode-btn" onclick="setMode('IDLE')">Idle</button>
        <button class="mode-btn" onclick="setMode('MANUAL')">Manual</button>
        <button class="mode-btn" onclick="setMode('FOLLOWING')">Follow</button>
        <button class="mode-btn" onclick="setMode('NAVIGATION')">Navigate</button>
      </div>

      <div id="manualSection" class="hidden">
        <h2>🕹️ Manual Drive</h2>
        <div class="drive-controls">
          <div></div>
          <button onclick="drive(1.5, 0)">▲</button>
          <div></div>
          <button onclick="drive(0, 1.0)">⟲</button>
          <button class="stop-btn" onclick="drive(0, 0)">■</button>
          <button onclick="drive(0, -1.0)">⟳</button>
          <div></div>
          <button onclick="drive(-1.5, 0)">▼</button>
          <div></div>
        </div>
      </div>

      <div id="navSection" class="hidden">
        <h2>🎯 Navigation Goal</h2>
        <div class="nav-inputs">
          <div class="input-group">
            <label>X Position</label>
            <input type="number" id="goalX" value="2.0" step="0.1">
          </div>
          <div class="input-group">
            <label>Y Position</label>
            <input type="number" id="goalY" value="0.0" step="0.1">
          </div>
          <div class="input-group">
            <label>Yaw (deg)</label>
            <input type="number" id="goalYaw" value="0" step="5">
          </div>
        </div>
        <div class="nav-buttons">
          <button onclick="sendGoal()" style="background: linear-gradient(145deg, #00cc44, #009933); border-color: #00ff66;">🚀 Send</button>
          <button onclick="cancelGoal()" style="background: linear-gradient(145deg, #ff8800, #cc6600); border-color: #ffaa00;">⛔ Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// --- ROBUST JAVASCRIPT LOGIC ---
window.ros = null;
window.teleopCmd = null;
window.uiModeCmd = null;
window.navActionClient = null;

document.addEventListener('DOMContentLoaded', function() {
  
  if (typeof ROSLIB === 'undefined') {
    document.getElementById('connIndicator').innerHTML = '⚠ ERROR: ROSLIB MISSING';
    return;
  }

  // 1. Connection
  window.ros = new ROSLIB.Ros({ url: 'ws://localhost:9090' });

  window.ros.on('connection', function() {
    console.log('[ROS] Connected');
    document.getElementById('connIndicator').textContent = '● CONNECTED';
    document.getElementById('connIndicator').className = 'connection-indicator connected';
  });

  window.ros.on('error', function(err) {
    console.error('[ROS] Error', err);
    document.getElementById('connIndicator').textContent = '● ERROR';
    document.getElementById('connIndicator').className = 'connection-indicator disconnected';
  });

  window.ros.on('close', function() {
    document.getElementById('connIndicator').textContent = '● DISCONNECTED';
    document.getElementById('connIndicator').className = 'connection-indicator disconnected';
  });

  // 2. TOPICS - Adapted to your ModeManager C++ Code
  
  // Matches "ui_mode_subscriber_abs_" in C++
  window.uiModeCmd = new ROSLIB.Topic({ 
    ros: window.ros, 
    name: '/ui/mode/absolute', 
    messageType: 'std_msgs/msg/String' 
  });

  // Matches "teleop_subscriber_" in C++
  window.teleopCmd = new ROSLIB.Topic({ 
    ros: window.ros, 
    name: '/teleop_cmd', 
    messageType: 'geometry_msgs/msg/Twist' 
  });
  
  // Action Client for Navigation (Standard Nav2)
  window.navActionClient = new ROSLIB.ActionClient({
    ros : window.ros,
    serverName : '/navigate_to_pose',
    actionName : 'nav2_msgs/action/NavigateToPose'
  });

  // Matches "mode_publisher_" in C++
  var robotModeTopic = new ROSLIB.Topic({ ros: window.ros, name: '/mode', messageType: 'std_msgs/msg/String' });
  
  var odomTopic = new ROSLIB.Topic({ ros: window.ros, name: '/odom', messageType: 'nav_msgs/msg/Odometry' });
  var scanTopic = new ROSLIB.Topic({ ros: window.ros, name: '/scan', messageType: 'sensor_msgs/msg/LaserScan' });

  // 3. Variables
  var robotPose = {x: 0, y: 0, yaw: 0};
  var latestScan = null;
  var hasPose = false;
  var cachedGoal = {x: 2.0, y: 0.0};
  var currentGoalHandle = null; // Store goal to cancel it later

  // 4. UI Update Logic
  function updateInterface(mode) {
    if (!mode) return;
    mode = mode.trim().toUpperCase();
    
    document.getElementById('currentMode').textContent = mode;
    
    // Highlight Buttons
    var buttons = document.querySelectorAll('.mode-btn');
    buttons.forEach(function(btn){
      btn.classList.remove('active');
      var label = btn.textContent.trim().toUpperCase();
      if(label === 'NAVIGATE') label = 'NAVIGATION';
      if(label === 'FOLLOW') label = 'FOLLOWING';
      if(label === mode) btn.classList.add('active');
    });

    // Show/Hide Sections
    var manualEl = document.getElementById('manualSection');
    var navEl = document.getElementById('navSection');
    
    manualEl.style.display = 'none';
    navEl.style.display = 'none';

    if (mode === 'MANUAL') {
      manualEl.style.display = 'block';
    } else if (mode === 'NAVIGATION') {
      navEl.style.display = 'block';
    }
  }

  // Subscribe to Robot Mode
  robotModeTopic.subscribe(function(msg) { updateInterface(msg.data); });
  
  setTimeout(function(){ 
    if(document.getElementById('currentMode').textContent === 'UNKNOWN') updateInterface('IDLE'); 
  }, 1000);


  // 5. Visualization
  var canvas = document.getElementById('robotCanvas');
  var ctx = canvas.getContext('2d');
  var scale = 80; 
  var offX = canvas.width / 2; 
  var offY = canvas.height / 2;

  var bgCanvas = document.createElement('canvas');
  bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
  var bgCtx = bgCanvas.getContext('2d');
  bgCtx.fillStyle = '#ffffff'; bgCtx.fillRect(0,0,800,600);
  bgCtx.strokeStyle = '#e0e0e0'; bgCtx.lineWidth = 1;
  for(var i=-15; i<=15; i++) {
    bgCtx.beginPath(); bgCtx.moveTo(offX + i*scale, 0); bgCtx.lineTo(offX + i*scale, 600); bgCtx.stroke();
    bgCtx.beginPath(); bgCtx.moveTo(0, offY + i*scale); bgCtx.lineTo(800, offY + i*scale); bgCtx.stroke();
  }
  bgCtx.strokeStyle = '#000'; bgCtx.lineWidth = 2;
  bgCtx.beginPath(); bgCtx.moveTo(offX, 0); bgCtx.lineTo(offX, 600); bgCtx.stroke();
  bgCtx.beginPath(); bgCtx.moveTo(0, offY); bgCtx.lineTo(800, offY); bgCtx.stroke();

  odomTopic.subscribe(function(msg) {
    var p = msg.pose.pose.position;
    var q = msg.pose.pose.orientation;
    var yaw = Math.atan2(2*(q.w*q.z + q.x*q.y), 1 - 2*(q.y*q.y + q.z*q.z));
    robotPose = {x: p.x, y: p.y, yaw: yaw};
    hasPose = true;
    document.getElementById('posX').textContent = p.x.toFixed(2);
    document.getElementById('posY').textContent = p.y.toFixed(2);
    document.getElementById('posYaw').textContent = (yaw * 180 / Math.PI).toFixed(1) + '°';
  });

  scanTopic.subscribe(function(msg) { latestScan = msg; });

  function draw() {
    ctx.drawImage(bgCanvas, 0, 0);

    if(document.getElementById('navSection').style.display === 'block') {
      var gx = offX + cachedGoal.x*scale;
      var gy = offY - cachedGoal.y*scale;
      ctx.beginPath(); ctx.arc(gx, gy, 10, 0, 6.28); ctx.fillStyle = '#8000ff'; ctx.fill();
    }

    if(hasPose) {
      var rx = offX + robotPose.x*scale;
      var ry = offY - robotPose.y*scale;
      if(latestScan) {
        ctx.save(); ctx.translate(rx, ry); ctx.rotate(-robotPose.yaw);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
        var angle = latestScan.angle_min;
        latestScan.ranges.forEach(function(r) {
          if(r > latestScan.range_min && r < latestScan.range_max) {
             ctx.beginPath(); ctx.moveTo(0,0);
             ctx.lineTo(r*Math.cos(angle)*scale, -r*Math.sin(angle)*scale);
             ctx.stroke();
          }
          angle += latestScan.angle_increment;
        });
        ctx.restore();
      }
      ctx.save(); ctx.translate(rx, ry); ctx.rotate(-robotPose.yaw);
      ctx.fillStyle = '#ff2222'; ctx.strokeStyle = '#660000'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(-12,-10); ctx.lineTo(-12,10); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  draw();


  // --- BUTTON HANDLERS ---
  window.setMode = function(mode) {
    var upper = mode.trim().toUpperCase();
    console.log('[UI] Setting Mode:', upper);
    
    // 1. Force UI update immediately (Optimistic)
    updateInterface(upper);
    
    // 2. Send Command to /ui/mode/absolute
    if(window.uiModeCmd) {
      window.uiModeCmd.publish(new ROSLIB.Message({ data: upper }));
    }
  };

  window.drive = function(linear, angular) {
    // Send to /teleop_cmd
    if(window.teleopCmd) {
      window.teleopCmd.publish(new ROSLIB.Message({
        linear: {x: linear, y: 0, z: 0},
        angular: {x: 0, y: 0, z: angular}
      }));
    }
  };

  window.sendGoal = function() {
    var x = parseFloat(document.getElementById('goalX').value);
    var y = parseFloat(document.getElementById('goalY').value);
    var yaw = parseFloat(document.getElementById('goalYaw').value);
    cachedGoal = {x: x, y: y};

    if(document.getElementById('currentMode').textContent !== 'NAVIGATION') {
       window.setMode('NAVIGATION');
       setTimeout(window.sendGoal, 200);
       return;
    }

    // Creating Action Goal
    var goal = new ROSLIB.Goal({
      actionClient : window.navActionClient,
      goalMessage : {
        pose : {
          header : { frame_id : 'map' },
          pose : {
            position : {x : x, y : y, z : 0},
            orientation : {z : Math.sin(yaw*Math.PI/360), w : Math.cos(yaw*Math.PI/360)}
          }
        }
      }
    });

    goal.on('feedback', function(feedback) {
      console.log('Feedback:', feedback);
    });

    goal.on('result', function(result) {
      console.log('Result:', result);
      document.getElementById('goalStatus').textContent = 'ARRIVED';
      document.getElementById('goalStatus').style.color = '#4CAF50';
    });

    goal.send();
    currentGoalHandle = goal; // Save for cancellation
    
    document.getElementById('goalStatus').textContent = 'SENT';
    document.getElementById('goalStatus').style.color = '#ffaa00';
  };

  window.cancelGoal = function() {
    if(currentGoalHandle) {
       currentGoalHandle.cancel();
       document.getElementById('goalStatus').textContent = 'CANCELLED';
       document.getElementById('goalStatus').style.color = '#ff4444';
    }
  };
  
});
</script>
</body>
</html>
