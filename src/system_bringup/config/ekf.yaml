ekf_filter_node:
  ros__parameters:
    frequency: 15.0
    two_d_mode: true
    publish_tf: true
    tf_buffer_duration: 10.0
    print_diagnostics: false

    map_frame: map
    odom_frame: custom_odom
    base_link_frame: custom_base_link
    world_frame: custom_odom

    # Encodere — doar viteze
    odom0: /custom_odom_topic
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: true
    odom0_relative: true
    odom0_queue_size: 10

    # rf2o — doar viteze, diferential
    odom1: /odom_rf2o
    odom1_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,
                    false, false, true,
                    false, false, false]
    odom1_differential: false
    odom1_relative: true
    odom1_queue_size: 10
    odom1_nodelay: true

    process_noise_covariance: [0.05,   0,      0,      0,      0,      0,
                                0,     0.05,   0,      0,      0,      0,
                                0,     0,      0.06,   0,      0,      0,
                                0,     0,      0,      0.03,   0,      0,
                                0,     0,      0,      0,      0.03,   0,
                                0,     0,      0,      0,      0,      0.06]