slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: custom_odom
    base_frame: custom_base_link
    map_frame: map
    scan_topic: /scan

    resolution: 0.05
    max_laser_range: 12.0

    tf_buffer_size: 50
    transform_timeout: 1.0

    minimum_travel_distance: 0.3    # era 0.1 — mai rar, mai stabil
    minimum_travel_heading: 0.3

    scan_buffer_size: 50            # era 20 — mai multe scanuri pt loop closure
    scan_buffer_discount: 0.3

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver_type: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner_type: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    use_scan_matching: true
    use_scan_barycenter: true

    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    maximum_distance_stronger_constraint: 0.5
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.55  # era 0.35 — mai strict
    loop_match_minimum_response_fine: 0.65    # era 0.45 — mai strict

    correlation_search_space_dimension: 0.5
    correlation_search_space_smear: 0.03
    correlation_search_space_step_size: 0.05

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    mode: mapping